[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "llm-api-toolbox-backend"
version = "1.5.0"
description = "Unified local gateway for OpenAI, Anthropic and compatible LLM APIs"
requires-python = ">=3.12,<3.14"
dependencies = [
  "anthropic==0.125.0",
  "fastapi==0.141.1",
  "httpx[socks]==0.28.1",
  "openai==2.54.0",
  "pydantic-settings==2.15.0",
  "uvicorn[standard]==0.53.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "pytest-asyncio==0.26.0",
  "pytest-cov==7.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --cov=app --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["app"]
